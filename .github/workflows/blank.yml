
name: Build Miyar APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "Miyar_GitHub_Starter.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="Miyar_GitHub_Starter.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP file not found: $ZIP_FILE"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          WRAPPER="$(find extracted -type f \
            -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::No Gradle wrapper (gradlew) found in ZIP."
            echo "The project structure must be checked."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
