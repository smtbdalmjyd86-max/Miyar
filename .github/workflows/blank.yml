
name: Build Miyar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required ZIP files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project archive..."
          test -f Miyar_GitHub_Starter.zip

          echo "Checking updated source archive..."
          test -f Miyar-source-files-menu-icon.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q Miyar_GitHub_Starter.zip -d project

          PROJECT_DIR="$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Apply menu icon source updates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p updates
          unzip -q Miyar-source-files-menu-icon.zip -d updates

          if [ -z "$(find updates -type f -print -quit)" ]; then
            echo "::error::The update ZIP contains no files"
            exit 1
          fi

          echo "Files inside update archive:"
          find updates -type f

          cp -a updates/. "$PROJECT_DIR/"

          echo "Source updates copied successfully."

      - name: Configure Java and Kotlin targets
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          candidates = [
              root / "app" / "build.gradle",
              root / "app" / "build.gradle.kts",
          ]

          build_file = next((p for p in candidates if p.is_file()), None)

          if build_file is None:
              raise SystemExit(
                  "ERROR: app/build.gradle or app/build.gradle.kts was not found"
              )

          text = build_file.read_text(encoding="utf-8")
          is_kts = build_file.name.endswith(".kts")

          java_version = "JavaVersion.VERSION_17"

          if "compileOptions" in text:
              text = re.sub(
                  r"sourceCompatibility\s*(?:=)?\s*"
                  r"(?:JavaVersion\.)?VERSION_1_8",
                  "sourceCompatibility = " + java_version
                  if is_kts else "sourceCompatibility JavaVersion.VERSION_17",
                  text,
              )
              text = re.sub(
                  r"targetCompatibility\s*(?:=)?\s*"
                  r"(?:JavaVersion\.)?VERSION_1_8",
                  "targetCompatibility = " + java_version
                  if is_kts else "targetCompatibility JavaVersion.VERSION_17",
                  text,
              )

          if is_kts:
              if "compileOptions" not in text:
                  block = (
                      "\n    compileOptions {\n"
                      "        sourceCompatibility = JavaVersion.VERSION_17\n"
                      "        targetCompatibility = JavaVersion.VERSION_17\n"
                      "    }\n"
                  )
                  text = re.sub(r"android\s*\{", lambda m: m.group(0) + block,
                                text, count=1)
          else:
              if "compileOptions" not in text:
                  block = (
                      "\n    compileOptions {\n"
                      "        sourceCompatibility JavaVersion.VERSION_17\n"
                      "        targetCompatibility JavaVersion.VERSION_17\n"
                      "    }\n"
                  )
                  text = re.sub(r"android\s*\{", lambda m: m.group(0) + block,
                                text, count=1)

          build_file.write_text(text, encoding="utf-8")
          print("Updated:", build_file)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Build finished without producing a debug APK"
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Miyar-debug.apk
          echo "path=release/Miyar-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Miyar APK
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-debug-APK
          path: release/Miyar-debug.apk
          if-no-files-found: error
