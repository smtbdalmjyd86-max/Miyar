
name: Build Miyar 0.9.3.6 Priority 1 Signed APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check update archive
        run: |
          test -f Miyar-Update-0.9.3.6-Priority1.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          mkdir -p project
          unzip -q Miyar-Update-0.9.3.6-Priority1.zip -d project

          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml

      - name: Verify app version and package
        working-directory: project
        run: |
          grep -q 'applicationId = "com.miyar.app"' app/build.gradle.kts
          grep -q 'versionCode = 20' app/build.gradle.kts
          grep -q 'versionName = "0.9.3.6"' app/build.gradle.kts

      - name: Configure Gradle memory
        working-directory: project
        shell: bash
        run: |
          touch gradle.properties

          sed -i \
            -e '/^org.gradle.jvmargs=/d' \
            -e '/^org.gradle.workers.max=/d' \
            -e '/^org.gradle.parallel=/d' \
            -e '/^kotlin.compiler.execution.strategy=/d' \
            gradle.properties

          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/miyar-release.jks"
          test -s "$RUNNER_TEMP/miyar-release.jks"

      - name: Build and test release
        working-directory: project
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/miyar-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --version
          gradle --no-daemon --max-workers=1 testDebugUnitTest assembleRelease

      - name: Verify release APK
        run: |
          APK=$(find project/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          test -f "$APK"

          apksigner verify --verbose "$APK"

          mkdir -p release-output
          cp "$APK" release-output/Miyar-0.9.3.6-Priority1-Signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-0.9.3.6-Priority1-Signed-APK
          path: release-output/Miyar-0.9.3.6-Priority1-Signed.apk
          if-no-files-found: error
