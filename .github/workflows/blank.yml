
name: Build Miyar 0.9.3.6 Priority 1 Signed APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # Signing file: one path shared by all signing variables
      ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/miyar-release.jks
      KEYSTORE_FILE: ${{ runner.temp }}/miyar-release.jks
      STORE_FILE: ${{ runner.temp }}/miyar-release.jks

      # Signing credentials
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Gradle project properties
      ORG_GRADLE_PROJECT_storeFile: ${{ runner.temp }}/miyar-release.jks
      ORG_GRADLE_PROJECT_storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check update archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Miyar-Update-0.9.3.6-Priority1.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q Miyar-Update-0.9.3.6-Priority1.zip -d project

          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml

      - name: Verify app version and package
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.miyar.app"' app/build.gradle.kts
          grep -Fq 'versionCode = 20' app/build.gradle.kts
          grep -Fq 'versionName = "0.9.3.6"' app/build.gradle.kts

      - name: Configure Gradle memory
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          touch gradle.properties
          sed -i \
            -e '/^org.gradle.jvmargs=/d' \
            -e '/^org.gradle.workers.max=/d' \
            -e '/^org.gradle.parallel=/d' \
            -e '/^kotlin.compiler.execution.strategy=/d' \
            gradle.properties

          cat >> gradle.properties <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1)"
          fi

          test -x "$SDKMANAGER"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Restore and verify signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$ANDROID_KEYSTORE_FILE"

          test -s "$ANDROID_KEYSTORE_FILE"
          test -f "$ANDROID_KEYSTORE_FILE"

          echo "Signing file restored successfully."
          ls -l "$ANDROID_KEYSTORE_FILE"

      - name: Verify signing variables
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_FILE"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -s "$ANDROID_KEYSTORE_FILE"

          echo "All signing variables are available."

      - name: Build and test release
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          gradle --no-daemon \
            --max-workers=1 \
            testDebugUnitTest \
            assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find project/app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          test -n "$APK"
          test -f "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p release-output

          cp "$APK" \
            release-output/Miyar-0.9.3.6-Priority1-Signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-0.9.3.6-Priority1-Signed-APK
          path: release-output/Miyar-0.9.3.6-Priority1-Signed.apk
          if-no-files-found: error
