
name: Build Miyar 0.9.3.6 Priority 1 Signed APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Verify update archive
      - name: Check update archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Miyar-Update-0.9.3.6-Priority1.zip
          echo "Update archive found."

      # 4. Extract Android project
   
      - name: Diagnose and prepare Android project
        id: project
        shell: bash
        run: |
          set -uo pipefail

          echo "===== ZIP CONTENTS ====="
          unzip -l Miyar-Update-0.9.3.6-Priority1.zip | head -100

          mkdir -p project
          unzip -q Miyar-Update-0.9.3.6-Priority1.zip -d project

          echo "===== SEARCHING PROJECT FILES ====="

          find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "gradlew" -o \
            -name "AndroidManifest.xml" \
          \) -print | head -100

          SETTINGS="$(find project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::SETTINGS FILE NOT FOUND"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT DIRECTORY: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::APP BUILD FILE NOT FOUND"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::ANDROID MANIFEST NOT FOUND"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "GRADLE WRAPPER FOUND"
          else
            echo "::warning::GRADLE WRAPPER NOT FOUND"
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "PROJECT VERIFIED"


      # 5. Verify application identity and version
      - name: Verify app version and package
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'applicationId = "com.miyar.app"' app/build.gradle.kts
          grep -Fq 'versionCode = 20' app/build.gradle.kts
          grep -Fq 'versionName = "0.9.3.6"' app/build.gradle.kts

          echo "Application identity verified."

      # 6. Configure Gradle memory
      - name: Configure Gradle memory
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          touch gradle.properties

          sed -i \
            -e '/^org.gradle.jvmargs=/d' \
            -e '/^org.gradle.workers.max=/d' \
            -e '/^org.gradle.parallel=/d' \
            -e '/^kotlin.compiler.execution.strategy=/d' \
            gradle.properties

          cat >> gradle.properties <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES

      # 7. Setup Android SDK
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8. Restore signing key
      - name: Restore and verify signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"

          KEYSTORE="$RUNNER_TEMP/miyar-release.jks"

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Signing key restored successfully."

      # 9. Verify signing credentials
      - name: Verify signing variables
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -s "$ANDROID_KEYSTORE_FILE"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "Signing credentials verified."

      # 10. Build and test release
      - name: Build and test release
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

          ORG_GRADLE_PROJECT_storeFile: ${{ runner.temp }}/miyar-release.jks
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version

          ./gradlew \
            --no-daemon \
            --max-workers=1 \
            testDebugUnitTest \
            assembleRelease

      # 11. Verify signed APK
      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find '${{ steps.project.outputs.dir }}/app/build/outputs/apk/release' \
            -maxdepth 1 -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK"
          test -f "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p release-output

          cp "$APK" \
            release-output/Miyar-0.9.3.6-Priority1-Signed.apk

          echo "Signed APK verified successfully."

      # 12. Upload APK
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-0.9.3.6-Priority1-Signed-APK
          path: release-output/Miyar-0.9.3.6-Priority1-Signed.apk
          if-no-files-found: error
