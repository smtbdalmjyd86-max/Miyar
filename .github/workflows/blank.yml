
      - name: Apply Miyar menu and icon updates
        shell: bash
        run: |
          set -euxo pipefail

          test -s Miyar-source-files-menu-icon.zip
          rm -rf updates
          mkdir -p updates
          unzip -o Miyar-source-files-menu-icon.zip -d updates

          test -s updates/MainActivity.kt
          test -s updates/data/Models.kt
          test -s updates/data/MiyarDatabase.kt
          test -d updates/android-res

          cp updates/MainActivity.kt project/app/src/main/java/com/miyar/app/MainActivity.kt
          cp updates/data/Models.kt project/app/src/main/java/com/miyar/app/data/Models.kt
          cp updates/data/MiyarDatabase.kt project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          cp -R updates/android-res/. project/app/src/main/res/

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("project/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          match = re.search(r'<application\b[^>]*>', content, re.S)
          if not match:
              raise SystemExit("ERROR: application tag not found in AndroidManifest.xml")

          tag = match.group(0)

          if not re.search(r'\bandroid:icon\s*=', tag):
              tag = tag[:-1] + ' android:icon="@mipmap/ic_launcher">'

          if not re.search(r'\bandroid:roundIcon\s*=', tag):
              tag = tag[:-1] + ' android:roundIcon="@mipmap/ic_launcher_round">'

          content = content[:match.start()] + tag + content[match.end():]
          manifest.write_text(content, encoding="utf-8")

          print("Manifest updated successfully.")
          PY

          echo "Launcher resources found:"
          find project/app/src/main/res -type f \( -name 'ic_launcher.xml' -o -name 'ic_launcher_round.xml' \) -print

          test -s project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s project/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "Miyar updates applied successfully."
