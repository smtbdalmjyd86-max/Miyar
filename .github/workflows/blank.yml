
name: Diagnose Miyar Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect ZIP contents
        shell: bash
        run: |
          set -e

          ZIP="Miyar_GitHub_Starter.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP file is missing"
            ls -lah
            exit 1
          fi

          echo "===== ZIP FILE INFORMATION ====="
          ls -lh "$ZIP"
          file "$ZIP"

          echo "===== ARCHIVE CONTENTS ====="
          unzip -l "$ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "===== EXTRACTED FILE TREE ====="
          find extracted -maxdepth 5 -type f | sort

          echo "===== ANDROID BUILD FILES ====="
          find extracted -type f \( \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts -o \
            -name AndroidManifest.xml \
          \) -print

          echo "===== PROJECT DIAGNOSIS ====="

          if find extracted -type f \
            -name gradlew -print -quit | grep -q .; then
            echo "RESULT: Gradle wrapper exists."
          elif find extracted -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \
          \) -print -quit | grep -q .; then
            echo "RESULT: Gradle files exist, but wrapper is missing."
          else
            echo "::warning::No Gradle build files found."
            echo "The ZIP may not contain a complete Android project."
          fi
