name: Build Miyar 0.9.3.6 Priority 1 Signed APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and check update archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_NAME="Miyar-Update-0.9.3.6-Priority1.zip"
          ARCHIVE_PATH="$(find . -type f -name "$ARCHIVE_NAME" -not -path './.git/*' -print -quit)"

          if [ -z "$ARCHIVE_PATH" ]; then
            echo "::error::لم يتم العثور على $ARCHIVE_NAME داخل المستودع. ارفع ملف ZIP إلى جذر المستودع أو مجلد updates ثم أعد التشغيل."
            echo "ملفات ZIP الموجودة حاليًا:"
            find . -type f \( -iname '*.zip' -o -iname '*.ZIP' \) -not -path './.git/*' -print || true
            exit 1
          fi

          if [ ! -s "$ARCHIVE_PATH" ]; then
            echo "::error::ملف التحديث موجود لكنه فارغ: $ARCHIVE_PATH"
            exit 1
          fi

          echo "تم العثور على ملف التحديث: $ARCHIVE_PATH"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Extract and validate Miyar source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "$ARCHIVE_PATH" -d project

          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml

          grep -q 'versionCode = 20' project/app/build.gradle.kts
          grep -q 'versionName = "0.9.3.6"' project/app/build.gradle.kts
          grep -q 'applicationId = "com.miyar.app"' project/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore permanent release signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/miyar-release.jks"
          test -s "$RUNNER_TEMP/miyar-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/miyar-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/miyar-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::لم يتم العثور على sdkmanager داخل Android SDK."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build signed release APK
        working-directory: project
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Verify signed APK and prepare release files
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Miyar-0.9.3.6-release.apk
          sha256sum release/Miyar-0.9.3.6-release.apk > release/SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-0.9.3.6-Priority1-Signed-APK
          path: project/release/*
          if-no-files-found: error
          retention-days: 30
