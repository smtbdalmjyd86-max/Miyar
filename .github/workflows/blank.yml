
name: Build Miyar 1.0.7 Complete Signed APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Miyar-Update-1.0.7-Complete.zip'
      - '.github/workflows/blank.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and validate Miyar 1.0.7 source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_NAME="Miyar-Update-1.0.7-Complete.zip"
          ARCHIVE_PATH="$(find . -type f -name "$ARCHIVE_NAME" -not -path './.git/*' -print -quit)"
          if [ -z "$ARCHIVE_PATH" ] || [ ! -s "$ARCHIVE_PATH" ]; then
            echo "::error::Missing or empty source archive: $ARCHIVE_NAME"
            exit 1
          fi
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Extract and validate package identity and safe migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "$ARCHIVE_PATH" -d project

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/gradle.properties

          grep -Fq 'applicationId = "com.miyar.app"' project/app/build.gradle.kts
          grep -Fq 'versionCode = 29' project/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.7"' project/app/build.gradle.kts

          grep -Fq 'import androidx.compose.ui.draw.drawBehind' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'version = 12' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'MIGRATION_11_12' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'fun observeHarvestOperations()' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'suspend fun getFilteredOperationPage' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'fun formatStockQuantity' project/app/src/main/java/com/miyar/app/data/FinanceCalculations.kt
          grep -Fq '11 لتر 750 ملي' project/app/src/test/java/com/miyar/app/data/FinanceCalculationsTest.kt
          grep -Fq '5 كيلو 400 جرام' project/app/src/test/java/com/miyar/app/data/FinanceCalculationsTest.kt
          grep -Fq 'activeStatusRow' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'activeUnitRow' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'listOf("سقي")' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'حالات الأصناف:' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'ChevronRight' project/app/src/main/java/com/miyar/app/FinanceScreens.kt

          if unzip -Z1 "$ARCHIVE_PATH" | grep -Eiq '(^|/)([^/]+\.(jks|keystore|p12))$'; then
            echo "::error::Signing key material must never be included in the source archive."
            exit 1
          fi

          grep -Fq 'photoUri: String?' project/app/src/main/java/com/miyar/app/data/Models.kt
          grep -Fq 'NavigationBarItem(' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'plantation_photos' project/app/src/main/java/com/miyar/app/MiyarTransfer.kt

          test -s project/app/src/main/res/drawable-nodpi/miyar_plant_branch.png
          test -s project/app/src/main/res/drawable/miyar_splash_background.xml
          test -s project/app/src/main/res/values-v31/styles.xml

          echo "Miyar 1.0.7 source validation completed."

      # إصلاح خطأ Kotlin: ArrowDropDown غير مستوردة
      - name: Fix missing ArrowDropDown import
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="app/src/main/java/com/miyar/app/MainActivity.kt"

          test -s "$MAIN_ACTIVITY"

          if ! grep -Fqx 'import androidx.compose.material.icons.filled.ArrowDropDown' "$MAIN_ACTIVITY"; then
            sed -i '/^import androidx.compose.material.icons.filled.ArrowBack$/a import androidx.compose.material.icons.filled.ArrowDropDown' "$MAIN_ACTIVITY"
          fi

          grep -Fqx 'import androidx.compose.material.icons.filled.ArrowDropDown' "$MAIN_ACTIVITY"

          echo "ArrowDropDown import verified."

      - name: Configure Gradle memory
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          touch gradle.properties
          sed -i \
            -e '/^org.gradle.jvmargs=/d' \
            -e '/^org.gradle.workers.max=/d' \
            -e '/^org.gradle.parallel=/d' \
            -e '/^kotlin.compiler.execution.strategy=/d' \
            gradle.properties

          cat >> gradle.properties <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent Miyar release signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/miyar-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run unit tests and build release APK
        working-directory: project
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/miyar-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --max-workers=1 testDebugUnitTest assembleRelease

      - name: Verify APK identity and permanent signing certificate
        working-directory: project
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/miyar-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose "$APK"

          "$AAPT" dump badging "$APK" | grep -F "package: name='com.miyar.app' versionCode='29' versionName='1.0.7'"

          KEY_CERT_SHA="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':')"

          APK_CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':')"

          test -n "$KEY_CERT_SHA"
          test -n "$APK_CERT_SHA"
          test "${KEY_CERT_SHA,,}" = "${APK_CERT_SHA,,}"

          mkdir -p release
          cp "$APK" release/Miyar-1.0.7-Complete-Signed.apk
          sha256sum release/Miyar-1.0.7-Complete-Signed.apk > release/SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-1.0.7-Complete-Signed-APK
          path: project/release/*
          if-no-files-found: error
          retention-days: 30
