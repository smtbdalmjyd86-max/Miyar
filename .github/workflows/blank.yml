
name: Build Miyar APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. التأكد من وجود حزمة التحديث الجديدة
      - name: Check new update archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="Miyar-Update-0.2.0.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Update archive not found: $ARCHIVE"
            echo "Upload the ZIP to the repository root and commit it."
            exit 1
          fi

          echo "Update archive found:"
          ls -lh "$ARCHIVE"

      # 3. إعداد Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. إعداد Android SDK بالإصدار المصحح
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 5. تثبيت منصة Android وأدوات البناء المطلوبة
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. إعداد Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. فك ضغط حزمة التحديث الجديدة
      - name: Extract new Miyar source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/Miyar-Update-0.2.0.zip"
          SOURCE_DIR="$RUNNER_TEMP/miyar-source"

          mkdir -p "$SOURCE_DIR"
          unzip -q "$ARCHIVE" -d "$SOURCE_DIR"

          SETTINGS_FILE="$(find "$SOURCE_DIR" \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found in the archive."
            find "$SOURCE_DIR" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle file not found."
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "MIYAR_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Using the new Miyar source:"
          echo "$PROJECT_DIR"

          echo "Application version:"
          grep -n -E 'versionCode|versionName' \
            "$PROJECT_DIR/app/build.gradle" \
            "$PROJECT_DIR/app/build.gradle.kts" 2>/dev/null || true

      - name: Show Kotlin error context
        shell: bash
        run: |
          set -euo pipefail

          FILE="$(find "$MIYAR_PROJECT_DIR/app/src/main" \
            -name MainActivity.kt -print -quit)"

          echo "===== Lines 242-258 ====="
          nl -ba "$FILE" | sed -n '242,258p'

          echo "===== Lines 725-745 ====="
          nl -ba "$FILE" | sed -n '725,745p'

      # 8. بناء نسخة Debug من مِعيار
      - name: Build Miyar debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            -p "$MIYAR_PROJECT_DIR" \
            --no-daemon \
            assembleDebug

      # 9. التحقق من ملف APK الناتج
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$MIYAR_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::The expected APK was not generated."

            find "$MIYAR_PROJECT_DIR" \
              -path '*/build/outputs/apk/*' \
              -type f || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Miyar-0.2.0-debug.apk"

          echo "APK generated successfully:"
          ls -lh "$GITHUB_WORKSPACE/release/Miyar-0.2.0-debug.apk"

      # 10. رفع APK للتنزيل
      - name: Upload Miyar APK
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-0.2.0-APK
          path: release/Miyar-0.2.0-debug.apk
          if-no-files-found: error
          retention-days: 14
