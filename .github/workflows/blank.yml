name: Build Miyar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "Miyar_GitHub_Starter.zip" ]; then
            echo "::error::Miyar_GitHub_Starter.zip is missing from repository root"
            echo "Files available in repository:"
            ls -la
            exit 1
          fi

          echo "Project archive found successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p project
          unzip -q Miyar_GitHub_Starter.zip -d project

          PROJECT_DIR="$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project settings file was not found"
            echo "Extracted files:"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      - name: Apply optional menu icon updates
        shell: bash
        run: |
          set -euo pipefail

          UPDATE_ZIP="Miyar-source-files-menu-icon.zip"

          if [ -f "$UPDATE_ZIP" ]; then
            echo "Update archive found."

            mkdir -p updates
            unzip -q "$UPDATE_ZIP" -d updates

            if [ -z "$(find updates -type f -print -quit)" ]; then
              echo "::error::The update archive contains no files"
              exit 1
            fi

            echo "Files in update archive:"
            find updates -type f

            cp -a updates/. "$PROJECT_DIR/"

            echo "Menu icon updates applied."
          else
            echo "::warning::Update archive not found."
            echo "Continuing with the base Android project."
            echo "Menu icon updates have not been applied."
          fi

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_DIR/gradlew" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Gradle build files were not found"
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle configuration was not found"
            exit 1
          fi

          echo "Android project verification passed."

      - name: Configure Java and Kotlin targets
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])

          candidates = [
              root / "app" / "build.gradle",
              root / "app" / "build.gradle.kts",
          ]

          build_file = next(
              (p for p in candidates if p.is_file()),
              None
          )

          if build_file is None:
              raise SystemExit(
                  "App Gradle configuration was not found"
              )

          text = build_file.read_text(encoding="utf-8")
          is_kts = build_file.name.endswith(".kts")

          if "compileOptions" not in text:
              raise SystemExit(
                  "compileOptions block is missing. "
                  "Cannot safely configure Java compatibility automatically."
              )

          java_value = "JavaVersion.VERSION_17"

          source_pattern = (
              r"sourceCompatibility\s*(?:=)?\s*"
              r"(?:JavaVersion\.)?VERSION_1_8"
          )

          target_pattern = (
              r"targetCompatibility\s*(?:=)?\s*"
              r"(?:JavaVersion\.)?VERSION_1_8"
          )

          if is_kts:
              source_replacement = (
                  "sourceCompatibility = JavaVersion.VERSION_17"
              )
              target_replacement = (
                  "targetCompatibility = JavaVersion.VERSION_17"
              )
          else:
              source_replacement = (
                  "sourceCompatibility JavaVersion.VERSION_17"
              )
              target_replacement = (
                  "targetCompatibility JavaVersion.VERSION_17"
              )

          text = re.sub(
              source_pattern,
              source_replacement,
              text
          )

          text = re.sub(
              target_pattern,
              target_replacement,
              text
          )

          build_file.write_text(text, encoding="utf-8")

          print("Java compatibility checked:", build_file)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"

            "$PROJECT_DIR/gradlew" \
              -p "$PROJECT_DIR" \
              --no-daemon \
              assembleDebug
          else
            gradle \
              -p "$PROJECT_DIR" \
              --no-daemon \
              assembleDebug
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Miyar-debug.apk

          echo "APK generated successfully."
          ls -lh release/Miyar-debug.apk

      - name: Upload Miyar APK
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-debug-APK
          path: release/Miyar-debug.apk
          if-no-files-found: error
