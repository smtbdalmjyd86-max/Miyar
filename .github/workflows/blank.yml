name: Build Miyar 0.6.0 APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager is not executable."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Miyar 0.6.0 source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="Miyar-Update-0.6.0-Complete.zip"

          echo "Searching for $ARCHIVE ..."

          ARCHIVE_PATH="$(find . -type f -name "$ARCHIVE" \
            -not -path "./.git/*" -print -quit)"

          if [ -z "$ARCHIVE_PATH" ]; then
            echo "::error::The 0.6.0 ZIP archive is missing."
            echo "Upload this file to the repository:"
            echo "$ARCHIVE"
            echo "Files currently found in the repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found archive: $ARCHIVE_PATH"

          unzip -tq "$ARCHIVE_PATH"

          rm -rf project
          mkdir -p project

          unzip -q "$ARCHIVE_PATH" -d project

          SETTINGS_FILE="$(find project -type f \
            -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts was not found inside the ZIP."
            find project -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project source verified:"
          echo "$PROJECT_DIR"

      - name: Run unit tests and build APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Miyar 0.6.0..."

          gradle \
            -p "$PROJECT_DIR" \
            --no-daemon \
            testDebugUnitTest \
            assembleDebug

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          unzip -tq "$APK"

          mkdir -p release

          cp "$APK" release/Miyar-0.6.0-debug.apk

          sha256sum release/Miyar-0.6.0-debug.apk \
            | tee release/SHA256SUMS.txt

          echo "APK successfully verified."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-0.6.0-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
