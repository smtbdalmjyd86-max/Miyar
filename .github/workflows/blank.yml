name: Build Miyar 1.1.4 Complete Signed APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Miyar-Update-1.1.4-Complete.zip'
      - '.github/workflows/blank.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and validate Miyar 1.1.4 source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_NAME="Miyar-Update-1.1.4-Complete.zip"
          ARCHIVE_PATH="$(find . -type f -name "$ARCHIVE_NAME" -not -path './.git/*' -print -quit)"
          if [ -z "$ARCHIVE_PATH" ] || [ ! -s "$ARCHIVE_PATH" ]; then
            echo "::error::Missing or empty source archive: $ARCHIVE_NAME"
            exit 1
          fi
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Extract and validate package identity and safe migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "$ARCHIVE_PATH" -d project
          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/gradle.properties
          grep -Fq 'applicationId = "com.miyar.app"' project/app/build.gradle.kts
          grep -Fq 'versionCode = 35' project/app/build.gradle.kts
          grep -Fq 'versionName = "1.1.4"' project/app/build.gradle.kts
          grep -Fq 'import androidx.compose.ui.draw.drawBehind' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'version = 19' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'MIGRATION_17_18' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'MIGRATION_18_19' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'closedAtMillis' project/app/src/main/java/com/miyar/app/data/HarvestModels.kt
          grep -Fq 'operationGroupKey' project/app/src/main/java/com/miyar/app/data/HarvestModels.kt
          grep -Fq 'paymentGroupKey' project/app/src/main/java/com/miyar/app/data/HarvestModels.kt
          grep -Fq 'personalHarvestId' project/app/src/main/java/com/miyar/app/data/HarvestModels.kt
          grep -Fq 'saveGroupedHarvestPartyPayment' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'closePersonalHarvestSafely' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'observeBuyerSalesForPersonalHarvest' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'MiyarCommerceHubScreen' project/app/src/main/java/com/miyar/app/MainActivity.kt
          if grep -Fq 'MiyarCommerceHubScreen' project/app/src/main/java/com/miyar/app/HarvestScreens.kt; then
            echo "::error::The independent Commerce module must not be routed inside the harvest section."
            exit 1
          fi
          if grep -Fq '"revenue" -> Column' project/app/src/main/java/com/miyar/app/HarvestScreens.kt; then
            echo "::error::The standalone revenue/Commerce page must not remain inside the legacy harvest section."
            exit 1
          fi
          grep -Fq 'currentSection == "الإيرادات والمبيعات"' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'MiyarCommerceHubScreen(dao, plantations' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'CommerceHarvestDayEntity::class' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'observeCommercePartyRoleTotals' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          test -s project/tools/test_migration_16_17.py
          grep -Fq 'MIGRATION_16_17' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          test -s project/app/src/main/java/com/miyar/app/CommerceScreens.kt
          test -s project/app/src/main/java/com/miyar/app/data/CommerceModels.kt
          test -s project/app/src/main/java/com/miyar/app/data/CommerceCalculations.kt
          grep -Fq 'saveCommerceSale' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'addCommercePayment' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'commerce_payment_allocations' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'MIGRATION_12_13' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'MIGRATION_13_14' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'MIGRATION_14_15' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'MIGRATION_15_16' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'observePlantationActualHarvestCount' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'saveDistributorAdjustment' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'saveDistributionExpensePayment' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'saveHarvestPartyPayment' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'getStockUsageDetails(stockItemId' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'pickerWagesManual' project/app/src/main/java/com/miyar/app/data/HarvestModels.kt
          grep -Fq 'calculatedTotal' project/app/src/main/java/com/miyar/app/data/HarvestModels.kt
          grep -Fq 'observePlantationPrimaryOperationCount' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'pickerWagesManual' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'جارٍ تحميل بيانات المخزون' project/app/src/main/java/com/miyar/app/FinanceScreens.kt
          grep -Fq 'لا توجد أصناف في المخزون' project/app/src/main/java/com/miyar/app/FinanceScreens.kt
          grep -Fq 'تكاليف القطاف' project/app/src/main/java/com/miyar/app/HarvestScreens.kt
          grep -Fq 'DistributorAdjustmentDialog' project/app/src/main/java/com/miyar/app/HarvestScreens.kt
          grep -Fq 'فتغدو إدارة مواضعك أوضح' project/app/src/main/java/com/miyar/app/MainActivity.kt
          if grep -Fq 'تنفيذ وحقوق التطبيق المهندس' project/app/src/main/java/com/miyar/app/MainActivity.kt; then
            echo "::error::The former app-credit sentence must be removed from About."
            exit 1
          fi
          grep -Fq 'StockIssueVoucherEntity::class' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'StockIssueLineEntity::class' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'suspend fun saveStockIssue' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'MANUAL_ISSUE' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'suspend fun deleteStockIssue' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'canonicalQuantityUnit' project/app/src/main/java/com/miyar/app/data/FinanceCalculations.kt
          grep -Fq 'stockAfterIssue' project/app/src/main/java/com/miyar/app/data/FinanceCalculations.kt
          grep -Fq 'unknownUnitsAreRejectedInsteadOfAssumedToBeMilliliters' project/app/src/test/java/com/miyar/app/data/FinanceCalculationsTest.kt
          grep -Fq 'stockIssueCannotCreateNegativeBalance' project/app/src/test/java/com/miyar/app/data/FinanceCalculationsTest.kt
          grep -Fq 'lastReceivedAtMillis' project/app/src/main/java/com/miyar/app/data/FinanceModels.kt
          grep -Fq 'lastReceivedAtMillis DESC' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'سند صرف مخزني جديد' project/app/src/main/java/com/miyar/app/FinanceScreens.kt
          grep -Fq 'fun observeHarvestOperations()' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'suspend fun getFilteredOperationPage' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'fun formatStockQuantity' project/app/src/main/java/com/miyar/app/data/FinanceCalculations.kt
          grep -Fq '11 لتر 750 ملي' project/app/src/test/java/com/miyar/app/data/FinanceCalculationsTest.kt
          grep -Fq '5 كيلو 400 جرام' project/app/src/test/java/com/miyar/app/data/FinanceCalculationsTest.kt
          grep -Fq 'activeStatusRow' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'activeUnitRow' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'listOf("سقي")' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'حالات الأصناف:' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'ChevronRight' project/app/src/main/java/com/miyar/app/FinanceScreens.kt
          if unzip -Z1 "$ARCHIVE_PATH" | grep -Eiq '(^|/)([^/]+\.(jks|keystore|p12))$'; then
            echo "::error::Signing key material must never be included in the source archive."
            exit 1
          fi
          grep -Fq 'photoUri: String?' project/app/src/main/java/com/miyar/app/data/Models.kt
          grep -Fq 'NavigationBarItem(' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'plantation_photos' project/app/src/main/java/com/miyar/app/MiyarTransfer.kt
          grep -Fq 'observeAllOperationReminders()' project/app/src/main/java/com/miyar/app/data/MiyarDatabase.kt
          grep -Fq 'showIssueHistory by remember { mutableStateOf(false) }' project/app/src/main/java/com/miyar/app/FinanceScreens.kt
          grep -Fq 'onLongClick = { issueActionsMenuId = voucher.id }' project/app/src/main/java/com/miyar/app/FinanceScreens.kt
          if grep -Fq 'ترتيب الأصناف حسب آخر توريد أو إضافة رصيد' project/app/src/main/java/com/miyar/app/FinanceScreens.kt; then
            echo "::error::Internal inventory explanation should remain hidden."
            exit 1
          fi
          grep -Fq 'الديون والمستحقات' project/app/src/main/java/com/miyar/app/MainActivity.kt
          grep -Fq 'إدارة ملفات البائعين والعملاء والأرصدة المستحقة' project/app/src/main/java/com/miyar/app/HarvestScreens.kt
          grep -Fq 'ملفات العملاء بالأجل' project/app/src/main/java/com/miyar/app/HarvestScreens.kt
          grep -Fq 'PartyAmountCard' project/app/src/main/java/com/miyar/app/HarvestScreens.kt
          grep -Fq 'showOverdue' project/app/src/main/java/com/miyar/app/FinanceScreens.kt
          grep -Fq 'showHarvestOverdue' project/app/src/main/java/com/miyar/app/FinanceScreens.kt
          grep -Fq 'جميع المواعيد القادمة' project/app/src/main/java/com/miyar/app/FinanceScreens.kt
          grep -Fq 'SmartFollowUpSuggestion' project/app/src/main/java/com/miyar/app/FinanceScreens.kt
          test -s project/app/src/main/res/drawable-nodpi/miyar_plant_branch.png
          test -s project/app/src/main/res/drawable/miyar_splash_background.xml
          test -s project/app/src/main/res/values-v31/styles.xml
          echo "Miyar 1.1.4 package identity, independent Commerce navigation, legacy harvest ledgers, multi-product seller/debtor operations, grouped immediate payments, safe archive state and Room 19 migration source checks passed."

      - name: Validate legacy Room 16 to 19 migrations and harvest-ledger accounting
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_migration_16_17.py
          python3 tools/test_migration_17_19_legacy.py
          python3 tools/test_harvest_legacy_accounting_17_19.py

      - name: Configure Gradle memory
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          touch gradle.properties
          sed -i \
            -e '/^org.gradle.jvmargs=/d' \
            -e '/^org.gradle.workers.max=/d' \
            -e '/^org.gradle.parallel=/d' \
            -e '/^kotlin.compiler.execution.strategy=/d' \
            gradle.properties
          cat >> gradle.properties <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent Miyar release signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/miyar-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run unit tests and build release APK
        working-directory: project
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/miyar-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --max-workers=1 testDebugUnitTest assembleRelease

      - name: Verify APK identity and permanent signing certificate
        working-directory: project
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/miyar-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.miyar.app' versionCode='35' versionName='1.1.4'"
          KEY_CERT_SHA="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':')"
          APK_CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':')"
          test -n "$KEY_CERT_SHA"
          test -n "$APK_CERT_SHA"
          test "${KEY_CERT_SHA,,}" = "${APK_CERT_SHA,,}"
          EXPECTED_111_CERT_SHA="30d195176167ff943de71bc12a4980ddf16bf174418a520ecb748a6e3c2866d9"
          if [ "${APK_CERT_SHA,,}" != "${EXPECTED_111_CERT_SHA,,}" ]; then
            echo "::error::The release APK signing certificate does not match the certificate extracted from the supplied 1.1.1 APK."
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/Miyar-1.1.4-Complete-Signed.apk
          sha256sum release/Miyar-1.1.4-Complete-Signed.apk > release/SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-1.1.4-Complete-Signed-APK
          path: project/release/*
          if-no-files-found: error
          retention-days: 30
