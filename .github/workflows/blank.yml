name: Build Miyar APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required archives
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f Miyar_GitHub_Starter.zip ]; then
            echo "::error::Miyar_GitHub_Starter.zip is missing."
            exit 1
          fi

          if [ ! -f Miyar-update-download.zip ]; then
            echo "::error::Miyar-update-download.zip is missing."
            exit 1
          fi

          echo "Both archives are present."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p project
          unzip -q Miyar_GitHub_Starter.zip -d project

          SETTINGS_FILE="$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android settings.gradle was not found."
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Apply source update
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p updates
          unzip -q Miyar-update-download.zip -d updates

          if [ -z "$(find updates -type f -print -quit)" ]; then
            echo "::error::Update archive is empty."
            exit 1
          fi

          echo "Applying source update..."
          find updates -type f

          cp -a updates/. "$PROJECT_DIR/"

          echo "Source update copied."

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle configuration is missing."
            exit 1
          fi

          echo "Project files verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/miyar-jvm17.init.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
          }
          GRADLE

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"

            "$PROJECT_DIR/gradlew" \
              --init-script "$RUNNER_TEMP/miyar-jvm17.init.gradle" \
              -p "$PROJECT_DIR" \
              --no-daemon \
              assembleDebug
          else
            gradle \
              --init-script "$RUNNER_TEMP/miyar-jvm17.init.gradle" \
              -p "$PROJECT_DIR" \
              --no-daemon \
              assembleDebug
          fi

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Miyar-debug.apk

          echo "APK generated successfully:"
          ls -lh release/Miyar-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-debug-APK
          path: release/Miyar-debug.apk
          if-no-files-found: error
