name: Build Miyar 0.9.3.6 Priority 1 Signed APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and check update archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_NAME="Miyar-Update-0.9.3.6-Priority1.zip"
          ARCHIVE_PATH="$(find . -type f -name "$ARCHIVE_NAME" -not -path './.git/*' -print -quit)"
          if [ -z "$ARCHIVE_PATH" ] || [ ! -s "$ARCHIVE_PATH" ]; then
            echo "::error::Missing or empty update archive: $ARCHIVE_NAME"
            exit 1
          fi
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Extract and validate Miyar source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "$ARCHIVE_PATH" -d project

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/gradle.properties

          grep -Fq 'applicationId = "com.miyar.app"' project/app/build.gradle.kts
          grep -Fq 'versionCode = 20' project/app/build.gradle.kts
          grep -Fq 'versionName = "0.9.3.6"' project/app/build.gradle.kts

          echo "dir=project" >> "$GITHUB_OUTPUT"
          echo "Miyar source and app identity validated."

      - name: Configure Gradle memory
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          touch gradle.properties
          sed -i \
            -e '/^org.gradle.jvmargs=/d' \
            -e '/^org.gradle.workers.max=/d' \
            -e '/^org.gradle.parallel=/d' \
            -e '/^kotlin.compiler.execution.strategy=/d' \
            gradle.properties
          cat >> gradle.properties <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found on the runner."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent release signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/miyar-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build, test, and sign release APK
        working-directory: project
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/miyar-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --max-workers=1 testDebugUnitTest assembleRelease

      - name: Verify signed APK and prepare release files
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Miyar-0.9.3.6-Priority1-Signed.apk
          sha256sum release/Miyar-0.9.3.6-Priority1-Signed.apk > release/SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miyar-0.9.3.6-Priority1-Signed-APK
          path: project/release/*
          if-no-files-found: error
          retention-days: 30
